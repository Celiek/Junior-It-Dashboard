<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Tło: Ciemny motyw Slate -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Akcent: Gradient Indigo do Sky Blue -->
    <linearGradient id="accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Zaokrąglone tło kwadratu -->
  <rect width="64" height="64" rx="14" fill="url(#bg)" stroke="#1e293b" stroke-width="2" />

  <!-- Słupki wykresu (Analytics) -->
  <rect x="14" y="38" width="6" height="14" rx="2" fill="#3b82f6" opacity="0.85" />
  <rect x="23" y="30" width="6" height="22" rx="2" fill="#6366f1" opacity="0.95" />
  <rect x="32" y="22" width="6" height="30" rx="2" fill="url(#accent)" />

  <!-- Zamykająca klamra / slash programistyczny (IT / Code) -->
  <path d="M42 42 L48 36 L42 30" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="40" y1="20" x2="36" y2="24" stroke="#818cf8" stroke-width="2" stroke-linecap="round" />
</svg>